<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل اپ‌ها</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="پنل اپ‌ها">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --brand:#4f46e5; --bg:#f5f5fb; --fg:#1f2937; --muted:#6b7280; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --card:#1f2937; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: Vazirmatn, Tahoma, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #frame { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; background:#fff;
    padding-top:env(safe-area-inset-top); }
  #fab { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:5; display:none;
    width:40px; height:40px; border-radius:50%; border:0; background:var(--brand); color:#fff;
    font-size:18px; opacity:.55; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  #screen { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px 16px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
  #screen img { width:88px; height:88px; border-radius:22px; }
  h1 { margin:0; font-size:22px; }
  p { margin:0; color:var(--muted); line-height:1.8; max-width:420px; }
  .btn { display:block; width:100%; max-width:340px; padding:14px; border-radius:14px; border:0;
    background:var(--brand); color:#fff; font:inherit; font-size:16px; text-decoration:none; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--brand); border:1.5px solid var(--brand); }
  .card { background:var(--card); border-radius:14px; padding:14px; width:100%; max-width:340px; text-align:right; }
  label { display:flex; gap:8px; align-items:flex-start; padding:8px 0; line-height:1.7; }
  small { color:var(--muted); }
</style>
</head>
<body>
<iframe id="frame" title="پنل اپ‌ها" allow="microphone; clipboard-write; fullscreen"></iframe>
<button id="fab" title="باز کردن بیرون از قاب" aria-label="باز کردن بیرون از قاب">↗</button>

<main id="screen">
  <img src="icons/icon-192.png" alt="">
  <h1>پنل اپ‌ها</h1>
  <p id="msg">در حال باز کردن…</p>
  <a class="btn" id="open" href="#">باز کردن پنل</a>
  <div class="card" id="settings" hidden>
    <strong>نحوه‌ی باز شدن</strong>
    <label><input type="radio" name="mode" value="redirect"> <span>مستقیم<br><small>اگر داخل اپ وارد حساب گوگل نشد این را بزنید. «با صدا بگو» در این حالت روی گوشی کار نمی‌کند.</small></span></label>
    <label><input type="radio" name="mode" value="frame"> <span>داخل اپ، تمام‌صفحه (پیشنهادی)<br><small>شبیه اپ واقعی، و «با صدا بگو» هم کار می‌کند.</small></span></label>
  </div>
  <a class="btn ghost" id="toggleSettings" href="#">تنظیمات</a>
</main>

<script>
  // آدرس وب‌اپ Apps Script. اگر deploy جدید ساختید، فقط همین خط را عوض کنید.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxAgHi8gE08uAykk2jOTJ4Yf-VyaG-US24c9ETKp8Jkp4O0QzZg3ymnx2y3ZWM9TV7tXQ/exec';

  const $ = id => document.getElementById(id);
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
  const params = new URLSearchParams(location.search);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let mode = params.get('mode') || store.get('mode') || 'frame';
  if (params.get('mode')) store.set('mode', mode);

  $('open').href = APP_URL;
  document.querySelectorAll('input[name=mode]').forEach(r => {
    r.checked = r.value === mode;
    r.onchange = () => { mode = r.value; store.set('mode', mode); };
  });
  $('toggleSettings').onclick = e => { e.preventDefault(); $('settings').hidden = !$('settings').hidden; };
  $('open').onclick = e => { e.preventDefault(); launch(true); };
  $('fab').onclick = () => { location.href = APP_URL; };

  function launch(userTap) {
    if (mode === 'frame') {
      $('screen').style.display = 'none';
      $('frame').src = APP_URL;
      $('frame').style.display = 'block';
      $('fab').style.display = 'block';
    } else {
      location.href = APP_URL;
    }
  }

  // Opened from the home-screen icon -> go straight into the panel.
  // Opened in a normal browser tab -> show the page so it can be installed first.
  if (standalone && params.get('stay') === null) {
    launch(false);
  } else {
    $('msg').innerHTML = standalone
      ? 'برای باز کردن پنل دکمه را بزنید.'
      : 'برای نصب، از منوی مرورگر گزینه‌ی <bdi dir="ltr">Add to Home Screen</bdi> یا <bdi dir="ltr">Install app</bdi> را بزنید. بعد از نصب، با زدن آیکون مستقیم وارد پنل می‌شوید.';
  }

  // پل صدا: پنل داخل قاب اجازه‌ی میکروفون ندارد، پس ضبط و تبدیل گفتار را همین صفحه انجام می‌دهد
  // و متن را برای پنل می‌فرستد.
  let rec = null, recSrc = null, recOrigin = null;
  function toPanel(msg) { try { recSrc.postMessage(Object.assign({ src: 'panel-voice' }, msg), recOrigin); } catch (e) {} }
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.src !== 'panel-voice-cmd' || !/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    if (d.cmd === 'stop') { if (rec) try { rec.stop(); } catch (err) {} return; }
    if (d.cmd !== 'start') return;
    recSrc = e.source; recOrigin = e.origin;
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) { toPanel({ type: 'error', error: 'service-not-allowed' }); return; }
    if (rec) try { rec.abort(); } catch (err) {}
    const r = new R();
    r.lang = d.lang || 'fa-IR'; r.interimResults = true; r.continuous = true;
    let fin = '';
    r.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
      }
      toPanel({ type: 'text', text: fin + interim });
    };
    r.onerror = ev => { if (ev.error !== 'aborted') toPanel({ type: 'error', error: ev.error }); };
    r.onend = () => { if (rec === r) { rec = null; toPanel({ type: 'done' }); } };
    rec = r;
    try { r.start(); } catch (err) { rec = null; toPanel({ type: 'error', error: 'audio-capture' }); }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
